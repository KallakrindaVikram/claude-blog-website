{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<h1>Login</h1>
{% if error %}<p class="errors">{{ error }}</p>{% endif %}
<form method="post" action="{{ url_for('auth.login') }}">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label for="identifier">Username or email</label>
  <input id="identifier" name="identifier" type="text" value="{{ identifier }}" required maxlength="254" autocomplete="username">
  <label for="password">Password</label>
  <input id="password" name="password" type="password" required maxlength="128" autocomplete="current-password">
  <button type="submit">Log in</button>
</form>
<p>No account yet? <a href="{{ url_for('auth.register') }}">Register</a></p>
{% endblock %}
