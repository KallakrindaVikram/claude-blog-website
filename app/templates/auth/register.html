{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<h1>Register</h1>
{% if errors %}
  <ul class="errors">
    {% for error in errors %}<li>{{ error }}</li>{% endfor %}
  </ul>
{% endif %}
<form method="post" action="{{ url_for('auth.register') }}">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label for="username">Username</label>
  <input id="username" name="username" type="text" value="{{ username }}" required minlength="3" maxlength="30" pattern="[A-Za-z0-9_.\-]{3,30}" autocomplete="username">
  <label for="email">Email</label>
  <input id="email" name="email" type="email" value="{{ email }}" required maxlength="254" autocomplete="email">
  <label for="password">Password (8-128 characters)</label>
  <input id="password" name="password" type="password" required minlength="8" maxlength="128" autocomplete="new-password">
  <button type="submit">Create account</button>
</form>
<p>Already registered? <a href="{{ url_for('auth.login') }}">Log in</a></p>
{% endblock %}
