{% extends "base.html" %}
{% block title %}Delete blog{% endblock %}
{% block content %}
<h1>Delete this blog?</h1>
<p>Are you sure you want to permanently delete <strong>{{ post['title'] }}</strong>? This cannot be undone.</p>
<form method="post" action="{{ url_for('blog.delete', post_id=post['id']) }}">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <button class="danger" type="submit">Yes, delete</button>
  <a href="{{ url_for('blog.detail', post_id=post['id']) }}">Cancel</a>
</form>
{% endblock %}
