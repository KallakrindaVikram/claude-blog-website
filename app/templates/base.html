<!-- Generated by Claude Agentic SDLC Workflow -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <title>{% block title %}Blog{% endblock %} - Blog Website</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <script src="{{ url_for('static', filename='app.js') }}" defer></script>
</head>
<body{% block body_attrs %}{% endblock %}>
  <header class="site-header">
    <a class="brand" href="{{ url_for('blog.index') }}">Blog Website</a>
    <nav>
      {% if current_user %}
        <a href="{{ url_for('blog.create') }}">Create Blog</a>
        <span class="who">{{ current_user['username'] }}</span>
        <form class="inline" method="post" action="{{ url_for('auth.logout') }}">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <button type="submit">Logout</button>
        </form>
      {% else %}
        <a href="{{ url_for('auth.login') }}">Login</a>
        <a href="{{ url_for('auth.register') }}">Register</a>
      {% endif %}
    </nav>
  </header>
  <main>
    {% for message in get_flashed_messages() %}
      <p class="flash">{{ message }}</p>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
